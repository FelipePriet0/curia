<!doctype html>
<html><head><meta charset="utf-8"><title>Radii & Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-ui);display:flex;gap:14px;flex-wrap:wrap;}
  .b{background:#fff;border:1px solid var(--border-warm);width:96px;height:72px;display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:10px;color:var(--ink-60);letter-spacing:.08em;text-transform:uppercase;}
</style></head>
<body>
  <div class="b" style="border-radius:2px;">sm 2</div>
  <div class="b" style="border-radius:4px;">md 4</div>
  <div class="b" style="border-radius:6px;">lg 6 · default</div>
  <div class="b" style="border-radius:8px;">xl 8</div>
  <div class="b" style="border-radius:6px;box-shadow:0 1px 2px rgba(43,26,7,.04);">shadow sm</div>
  <div class="b" style="border-radius:6px;box-shadow:0 2px 8px rgba(43,26,7,.06);">shadow md</div>
  <div class="b" style="border-radius:6px;box-shadow:0 10px 30px rgba(43,26,7,.08);">shadow lg</div>
</body></html>
