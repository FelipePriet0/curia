<!doctype html>
<html><head><meta charset="utf-8"><title>Input</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-body);}
  .box{max-width:560px;background:#fff;border:1px solid var(--border-warm);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
  .box:focus-within{border-color:rgba(255,111,30,.45);box-shadow:0 0 0 3px rgba(255,111,30,.07);}
  textarea{border:none;outline:none;resize:none;font-family:var(--font-body);font-size:15px;color:var(--ink);min-height:40px;}
  textarea::placeholder{color:var(--ink-30);font-style:italic;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .badge{font-family:var(--font-ui);font-size:11px;color:var(--ink-45);background:rgba(43,26,7,.05);border:1px solid rgba(43,26,7,.1);border-radius:9999px;padding:2px 10px;}
  .send{width:34px;height:34px;border-radius:6px;background:#FF6F1E;color:#2B1A07;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:opacity .15s,transform .1s;}
  .send:hover{opacity:.88;transform:translateY(-1px);}
</style></head>
<body>
<div class="box">
  <textarea placeholder="Conte-nos o seu maior desafio, vamos resolvê-lo juntos." autofocus></textarea>
  <div class="row">
    <span class="badge">Curia Strategist</span>
    <button class="send" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
        <path d="m21.854 2.147-10.94 10.939"/>
      </svg>
    </button>
  </div>
</div>
</body></html>
