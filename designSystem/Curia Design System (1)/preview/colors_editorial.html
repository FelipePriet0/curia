<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Editorial</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-ui);}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .sw{border-radius:10px;padding:12px;border:1px solid var(--border-warm);min-height:82px;display:flex;flex-direction:column;justify-content:space-between;}
  .sw .name{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60);}
  .sw .hex{font-family:var(--font-mono);font-size:11px;color:var(--ink);}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#FDFBF9;"><span class="name">BG</span><span class="hex">#FDFBF9</span></div>
  <div class="sw" style="background:#2B1A07;color:#fff;"><span class="name" style="color:rgba(255,255,255,.7)">Ink</span><span class="hex" style="color:#fff">#2B1A07</span></div>
  <div class="sw" style="background:#FF6F1E;"><span class="name" style="color:#2B1A07">Action</span><span class="hex" style="color:#2B1A07">#FF6F1E</span></div>
  <div class="sw" style="background:#C9A84C;"><span class="name" style="color:#2B1A07">Gold</span><span class="hex" style="color:#2B1A07">#C9A84C</span></div>
  <div class="sw" style="background:#F5F0EC;"><span class="name">Surface soft</span><span class="hex">#F5F0EC</span></div>
  <div class="sw" style="background:#F5EDE0;"><span class="name">Surface warm</span><span class="hex">#F5EDE0</span></div>
  <div class="sw" style="background:#E4DFD7;"><span class="name">Border</span><span class="hex">#E4DFD7</span></div>
  <div class="sw" style="background:#1C0F06;color:#fff;"><span class="name" style="color:rgba(255,255,255,.7)">Sidebar dark</span><span class="hex" style="color:#fff">#1C0F06</span></div>
</div>
</body></html>
