<!doctype html>
<html><head><meta charset="utf-8"><title>Quickstart Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-body);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;}
.card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid rgba(43,26,7,.09);background:rgba(43,26,7,.025);cursor:pointer;transition:all .15s;}
.card:hover{background:rgba(255,111,30,.06);border-color:rgba(255,111,30,.25);transform:translateY(-1px);}
.ic{color:#FF6F1E;opacity:.8;font-size:18px;}
.lb{font-size:13px;color:rgba(43,26,7,.65);line-height:1.3;}
</style></head>
<body>
<div class="grid">
  <button class="card"><span class="ic">◑</span><span class="lb">Diagnosticar um gargalo de crescimento</span></button>
  <button class="card"><span class="ic">⬡</span><span class="lb">Revisar estratégia de pricing</span></button>
  <button class="card"><span class="ic">▲</span><span class="lb">Avaliar uma contratação-chave</span></button>
  <button class="card"><span class="ic">◇</span><span class="lb">Estruturar próximos 14 dias</span></button>
</div>
</body></html>
