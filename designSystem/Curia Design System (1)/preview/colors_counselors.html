<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Counselors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-ui);}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .c{border-radius:10px;padding:12px;min-height:82px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;}
  .c .role{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;}
  .c .hex{font-family:var(--font-mono);font-size:11px;opacity:.9;}
  .note{font-family:var(--font-ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-45);margin-bottom:10px;}
  .note em{font-style:normal;color:var(--action);letter-spacing:.04em;text-transform:none;font-family:var(--font-script);font-size:13px;}
</style></head>
<body>
<div class="note">Placeholder · cada personagem será lapidado <em>depois</em></div>
<div class="row">
  <div class="c" style="background:#C9A84C;color:#2B1A07"><span class="role">Estratégia</span><span class="hex">#C9A84C</span></div>
  <div class="c" style="background:#A8B5C0;color:#2B1A07"><span class="role">Finanças</span><span class="hex">#A8B5C0</span></div>
  <div class="c" style="background:#4A9B6F"><span class="role">Growth</span><span class="hex">#4A9B6F</span></div>
  <div class="c" style="background:#4A6FA5"><span class="role">Produto</span><span class="hex">#4A6FA5</span></div>
  <div class="c" style="background:#8B9BB4"><span class="role">Operações</span><span class="hex">#8B9BB4</span></div>
  <div class="c" style="background:#9B6BB4"><span class="role">Marca</span><span class="hex">#9B6BB4</span></div>
</div>
</body></html>
