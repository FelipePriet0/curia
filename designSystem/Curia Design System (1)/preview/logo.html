<!doctype html>
<html><head><meta charset="utf-8"><title>Logo & Wordmark — opções menos redondas</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,900,0&family=EB+Garamond:wght@800&family=Cormorant+SC:wght@700&family=Old+Standard+TT:wght@700&family=Crimson+Pro:wght@900&display=swap">
<style>body{margin:0;padding:22px;background:var(--bg);display:flex;flex-direction:column;gap:16px;}
.r{display:flex;align-items:baseline;gap:18px;padding-bottom:14px;border-bottom:1px solid rgba(43,26,7,0.08);}
.r:last-child{border-bottom:none;}
.note{font-family:var(--font-ui);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-45);min-width:140px;}
.pill{font-family:var(--font-ui);font-size:9px;background:rgba(43,26,7,0.06);color:var(--ink-60);padding:2px 6px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase;margin-left:auto;align-self:center;}
</style></head>
<body>

<div class="r">
  <span class="note">Atual · Fraunces SOFT 100</span>
  <span style="font-family:'Fraunces',serif;font-weight:900;font-size:64px;letter-spacing:-0.025em;color:var(--ink);font-variation-settings:'opsz' 144,'SOFT' 100;line-height:1;">Curia</span>
  <span class="pill">redonda</span>
</div>

<div class="r">
  <span class="note">A · Fraunces SOFT 0</span>
  <span style="font-family:'Fraunces',serif;font-weight:900;font-size:64px;letter-spacing:-0.025em;color:var(--ink);font-variation-settings:'opsz' 144,'SOFT' 0;line-height:1;">Curia</span>
  <span class="pill">cantos retos</span>
</div>

<div class="r">
  <span class="note">B · EB Garamond 800</span>
  <span style="font-family:'EB Garamond',serif;font-weight:800;font-size:72px;letter-spacing:-0.01em;color:var(--ink);line-height:1;">Curia</span>
  <span class="pill">renascentista</span>
</div>

<div class="r">
  <span class="note">C · Old Standard 700</span>
  <span style="font-family:'Old Standard TT',serif;font-weight:700;font-size:70px;letter-spacing:-0.005em;color:var(--ink);line-height:1;">Curia</span>
  <span class="pill">livro antigo</span>
</div>

<div class="r">
  <span class="note">D · Crimson Pro 900</span>
  <span style="font-family:'Crimson Pro',serif;font-weight:900;font-size:70px;letter-spacing:-0.015em;color:var(--ink);line-height:1;">Curia</span>
  <span class="pill">editorial denso</span>
</div>

<div class="r">
  <span class="note">E · Cormorant SC 700</span>
  <span style="font-family:'Cormorant SC',serif;font-weight:700;font-size:64px;letter-spacing:0.02em;color:var(--ink);line-height:1;">Curia</span>
  <span class="pill">small caps · senatorial</span>
</div>

</body></html>
