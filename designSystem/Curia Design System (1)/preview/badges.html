<!doctype html>
<html><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-ui);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.b{border-radius:9999px;padding:4px 12px;font-size:12px;display:inline-flex;gap:6px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;}
</style></head>
<body>
<span class="b" style="background:rgba(255,111,30,.1);color:#FF6F1E;"><span class="dot" style="background:#FF6F1E"></span>Acesso antecipado</span>
<span class="b" style="background:rgba(201,168,76,.1);color:#C9A84C;">PLANO DE AÇÃO</span>
<span class="b" style="background:rgba(74,155,111,.12);color:#4A9B6F;"><span class="dot" style="background:#4A9B6F"></span>Deliberando</span>
<span class="b" style="background:rgba(192,96,96,.1);color:#C06060;">Risco estratégico</span>
<span class="b" style="background:rgba(43,26,7,.05);color:rgba(43,26,7,.6);border:1px solid rgba(43,26,7,.1);">Curia Strategist</span>
</body></html>
