<!doctype html>
<html><head><meta charset="utf-8"><title>Chamber — preserved</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-ui);}
.box{border:1px dashed rgba(43,26,7,0.25);border-radius:6px;padding:18px 22px;display:flex;flex-direction:column;gap:8px;max-width:620px;}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--action);font-weight:600;}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--action);}
.path{font-family:var(--font-mono);font-size:12px;color:var(--ink);background:rgba(43,26,7,0.04);padding:6px 10px;border-radius:4px;display:inline-block;}
.note{font-family:var(--font-body);font-size:14px;color:var(--ink-60);line-height:1.55;margin:0;}
</style></head>
<body>
<div class="box">
  <span class="tag">Preservado · não editar</span>
  <p class="note">A Câmara é território do produto. O design system <strong>não recria</strong> esse componente — ele vive no código original e qualquer evolução parte de lá.</p>
  <span class="path">app/src/components/board/chamber/CuriaChambra.tsx</span>
</div>
</body></html>
