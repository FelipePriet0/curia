<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-ui);font-size:11px;color:var(--ink-60);}
.row{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.bar{background:#FF6F1E;height:10px;border-radius:2px;}
.lb{width:50px;letter-spacing:.1em;text-transform:uppercase;}
</style></head>
<body>
<div class="row"><span class="lb">4 · 1</span><div class="bar" style="width:4px"></div></div>
<div class="row"><span class="lb">8 · 2</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="lb">12 · 3</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="lb">16 · 4</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="lb">24 · 6</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="lb">32 · 8</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="lb">48 · 12</span><div class="bar" style="width:48px"></div></div>
<div class="row"><span class="lb">64 · 16</span><div class="bar" style="width:64px"></div></div>
<div class="row"><span class="lb">96 · 24</span><div class="bar" style="width:96px"></div></div>
</body></html>
