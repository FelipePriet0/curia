<!doctype html>
<html><head><meta charset="utf-8"><title>Verdict Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-body);}
.card{background:#fff;border:1px solid var(--border-warm);border-radius:12px;padding:14px 18px;max-width:560px;display:flex;flex-direction:column;gap:8px;border-left:2px solid rgba(201,168,76,0.5);}
.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#C9A84C;display:flex;gap:10px;align-items:center;}
.tag{font-size:10px;background:rgba(201,168,76,.1);color:#C9A84C;border-radius:4px;padding:1px 6px;text-transform:none;letter-spacing:.08em;}
.body{font-size:14px;color:rgba(43,26,7,.85);line-height:1.65;}
.body strong{color:var(--ink);}
</style></head>
<body>
<div class="card">
  <div class="lbl">Plano de ação <span class="tag">recomendações + próximos passos</span></div>
  <div class="body"><strong>1.</strong> Audite os cancelamentos dos últimos 60 dias por cohort — foque em quem churnou nos primeiros 14 dias.</div>
  <div class="body"><strong>2.</strong> Instrumente o evento de <em>primeira ativação</em> e crie alerta para contas sem ativação em D+3.</div>
</div>
</body></html>
